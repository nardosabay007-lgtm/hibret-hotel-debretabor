<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed | Hibret Hotel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-container {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 50px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .check {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #2e7d32;
            color: white;
            font-size: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .hotel-name {
            font-weight: bold;
            color: #8b6b3f;
        }

        .home-button {
            display: inline-block;
            padding: 13px 25px;
            background: #8b6b3f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #6f542f;
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="check">✓</div>

        <h1>Booking Request Submitted!</h1>

        <p>
            Thank you for choosing
            <span class="hotel-name">Hibret Hotel</span>.
            Your booking request has been received successfully.
        </p>

        <p>
            Our team will review your request and contact you
            to confirm the reservation.
        </p>

        <a href="index.html" class="home-button">
            Back to Home
        </a>

    </div>

</body>
</html>
